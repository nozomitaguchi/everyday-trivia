# Build the static site (tools/build.mjs, Node standard library only) and publish it with GitHub Pages.
# Takes effect once Settings -> Pages -> Source is set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: file commit dates for "recently deepened" and sitemap lastmod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node tools/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # share images (og:image) with the Chrome that ubuntu runners already have; adds the image tags only for
      # images that were made, so if this step fails the site deploys as before, just without share images
      - name: Share images
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/og.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
